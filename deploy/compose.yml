services:
  mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ATS_HOST: 0.0.0.0
      ATS_DEPLOYMENT_MODE: production
    ports:
      - "127.0.0.1:${PUBLISH_PORT:-8800}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
