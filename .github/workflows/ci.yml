name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,mcp]'
      - name: Verify tests
        run: pytest -q
      - name: Construct the MCP server
        # Catches SDK breakage (e.g. mcp 2.x renaming FastMCP) that unit tests
        # do not import.
        run: python -c "from ats_auditor.mcp_server import create_mcp; create_mcp(); print('MCP server constructs')"
      - name: Compile source
        run: python -m compileall -q src
  container:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build deployment image
        run: docker build --pull --tag ats-auditor:ci .
      - name: Confirm non-root image user
        run: docker image inspect ats-auditor:ci --format '{{.Config.User}}' | grep -q '^10001:10001$'
      - name: Start the image and hit /health
        # The build can succeed while the server crashes at import time; only a
        # running container proves the deployment will serve.
        run: |
          set -euo pipefail
          docker run -d --name ats-ci -p 127.0.0.1:8000:8000 ats-auditor:ci
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs ats-ci
          exit 1
      - name: Stop the test container
        if: always()
        run: docker rm -f ats-ci || true
