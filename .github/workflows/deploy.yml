name: Deploy to VPS

# Only a successful CI *push* to the protected main/dev branches can deploy.
# Never deploy from pull requests or untrusted forks.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  # One deploy at a time for the whole repository: the VPS is a 1 GB Micro and
  # two concurrent image builds can exhaust its memory.
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["main", "dev"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Environments named 'production' and 'staging'.
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out exact commit that passed CI, not a moving branch ref.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check out expected commit
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set deployment target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$BRANCH" = main ]; then
            echo 'DEPLOY_ENV=production' >> "$GITHUB_ENV"
          else
            echo 'DEPLOY_ENV=staging' >> "$GITHUB_ENV"
          fi

      - name: Verify required VPS secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing deployment secret::Set $name in the $DEPLOY_ENV environment or repository secrets."
              missing=1
            fi
          done
          if (( missing )); then
            echo "VPS deployment is not configured. CI checks passed, but nothing was deployed."
            exit 1
          fi

      - name: Configure pinned SSH key and host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ats_deploy"
          chmod 600 "$HOME/.ssh/ats_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Upload tested revision and deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"; : "${VPS_USER:?Missing VPS_USER}"
          SSH_OPTS=(-p "${VPS_SSH_PORT:-22}" -i "$HOME/.ssh/ats_deploy"
                    -o IdentitiesOnly=yes -o BatchMode=yes
                    -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          # The VPS account is locked down with a forced command: it accepts
          # only "deploy <env>" and never opens a shell, so this key cannot be
          # used for anything except shipping a release. Only tracked source
          # files are sent — no secrets, venvs or dot-env files.
          git ls-files -z | tar --null -czf - --files-from=- \
            | ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" "deploy $DEPLOY_ENV"
